name: Apply approved site release

on:
  push:
    branches:
      - main
    paths:
      - release/site-update.tar.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release archive
        run: |
          test -f release/site-update.tar.gz
          if tar -tzf release/site-update.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in release archive."
            exit 1
          fi

      - name: Apply release files
        run: |
          tar -xzf release/site-update.tar.gz -C .
          rm release/site-update.tar.gz
          rmdir release 2>/dev/null || true

      - name: Generate and validate static site
        run: |
          node scripts/build-site.mjs
          node --check script.js
          python3 scripts/validate-site.py

      - name: Commit approved release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SEO, FAQ, policies, and static prerendering"
          git push
