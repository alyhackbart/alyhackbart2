name: Apply approved site release

on:
  push:
    branches:
      - main
    paths:
      - release/APPLY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reassemble and verify release archive
        run: |
          test -f release/APPLY
          test -n "$(find release -maxdepth 1 -name 'site-update.b64.*' -print -quit)"
          cat release/site-update.b64.* | base64 --decode > /tmp/site-update.tar.gz
          if tar -tzf /tmp/site-update.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in release archive."
            exit 1
          fi

      - name: Apply release files
        run: |
          tar -xzf /tmp/site-update.tar.gz -C .
          rm -rf release

      - name: Convert embedded concept media into replaceable files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const media = {
            'media/hero.js': 'assets/media/hero-poster.webp',
            'media/restaurant.js': 'assets/media/restaurant.webp',
            'media/creator.js': 'assets/media/creator.webp',
            'media/event.js': 'assets/media/event.webp',
            'media/wedding.js': 'assets/media/wedding.webp',
            'media/reel.js': 'assets/media/hero-reel.mp4'
          };

          fs.mkdirSync('assets/media', { recursive: true });
          for (const [sourcePath, outputPath] of Object.entries(media)) {
            const source = fs.readFileSync(sourcePath, 'utf8');
            const match = source.match(/base64,([^'";]+)/);
            if (!match) throw new Error(`No embedded media found in ${sourcePath}`);
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });
            fs.writeFileSync(outputPath, Buffer.from(match[1], 'base64'));
          }
          NODE

      - name: Generate and validate static site
        run: |
          node scripts/build-site.mjs
          node --check script.js
          python3 scripts/validate-site.py

      - name: Commit approved release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add SEO, FAQ, policies, and static prerendering"
          git push
