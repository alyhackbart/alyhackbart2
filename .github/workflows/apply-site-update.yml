name: Apply approved Pages CMS migration

on:
  push:
    branches:
      - main
    paths:
      - release/APPLY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reassemble and verify migration archive
        run: |
          test -f release/APPLY
          test -n "$(find release -maxdepth 1 -name 'pages-cms-update.b64.*' -print -quit)"
          cat release/pages-cms-update.b64.* | base64 --decode > /tmp/pages-cms-update.tar.gz
          echo "a939d6e3b8503dd057b3a8a9e69745a3c7de05dd93ace47dab2346049ffcf548  /tmp/pages-cms-update.tar.gz" | sha256sum -c -
          if tar -tzf /tmp/pages-cms-update.tar.gz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in migration archive."
            exit 1
          fi

      - name: Apply Pages CMS migration
        run: |
          tar -xzf /tmp/pages-cms-update.tar.gz -C .
          rm -rf release

      - name: Build and validate site
        run: |
          node scripts/build-site.mjs
          node --check script.js
          node --check content/site-content.js
          node -e "JSON.parse(require('node:fs').readFileSync('content/site-content.json', 'utf8'))"
          python3 scripts/validate-site.py

      - name: Commit Pages CMS migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Pages CMS editing interface"
          git push
