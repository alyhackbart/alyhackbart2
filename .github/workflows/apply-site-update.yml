name: Apply approved cinematic portfolio release

on:
  push:
    branches:
      - main
    paths:
      - release/APPLY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reassemble and verify release archive
        run: |
          test -f release/APPLY
          test -n "$(find release -maxdepth 1 -name 'portfolio-release.b64.*' -print -quit)"
          cat release/portfolio-release.b64.* | base64 --decode > /tmp/portfolio-release.tar.xz
          echo "dd5c4341b983c0d5b16b94710b6bbc49592b1efaa55ed2b7908dbccced1686f0  /tmp/portfolio-release.tar.xz" | sha256sum -c -
          if tar -tJf /tmp/portfolio-release.tar.xz | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in release archive."
            exit 1
          fi

      - name: Apply portfolio release
        run: |
          tar -xJf /tmp/portfolio-release.tar.xz -C .
          rm -rf release

      - name: Build and validate portfolio
        run: |
          node scripts/build-site.mjs
          node --check script.js
          node --check content/site-content.js
          node -e "JSON.parse(require('node:fs').readFileSync('content/site-content.json', 'utf8'))"
          python3 scripts/validate-site.py
          bash scripts/check-guardrails.sh . --files templates/index.html templates/resume.html templates/privacy.html templates/thanks.html templates/404.html index.html resume.html privacy.html thanks.html 404.html script.js styles.css

      - name: Commit cinematic portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch cinematic video editor portfolio"
          git push
