name: Build web-ready portfolio reel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/assemble-reel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble source reel
        run: |
          cat \
            assets/media/selected-edit.part01.mp4 \
            assets/media/selected-edit.part02.mp4 \
            assets/media/selected-edit.part03.mp4 \
            assets/media/selected-edit.part04.mp4 \
            assets/media/selected-edit.part05.mp4 \
            > /tmp/selected-edit-source.mp4
          test "$(stat -c%s /tmp/selected-edit-source.mp4)" = "45009747"
          ffprobe -v error /tmp/selected-edit-source.mp4

      - name: Create vertical autoplay asset
        run: |
          ffmpeg -y \
            -i /tmp/selected-edit-source.mp4 \
            -an \
            -vf "scale=540:960" \
            -c:v libx264 \
            -preset medium \
            -crf 27 \
            -maxrate 1200k \
            -bufsize 2400k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            -map_metadata -1 \
            assets/media/selected-edit.web.mp4
          test -s assets/media/selected-edit.web.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 assets/media/selected-edit.web.mp4)" = "540x960"

      - name: Commit optimized reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/assemble-reel.yml
          git add assets/media/selected-edit.web.mp4
          git commit -m "Add web-ready vertical portfolio reel"
          git push
