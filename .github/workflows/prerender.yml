name: Prerender editable site content

on:
  push:
    branches:
      - main
    paths:
      - content/site-content.json
      - content/site-content.js
      - templates/**
      - scripts/build-site.mjs
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action payload
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate static pages
        run: node scripts/build-site.mjs

      - name: Validate generated site
        run: |
          node --check script.js
          node --check content/site-content.js
          node -e "JSON.parse(require('node:fs').readFileSync('content/site-content.json', 'utf8'))"
          python3 scripts/validate-site.py

      - name: Commit generated pages when needed
        run: |
          if git diff --quiet -- index.html privacy.html thanks.html robots.txt sitemap.xml; then
            echo "Generated pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html thanks.html robots.txt sitemap.xml
          git commit -m "Rebuild static pages from editable content"
          git push
