media:
  - name: portfolio
    label: Portfolio images and video
    input: assets/media
    output: /assets/media
    categories: [image, video]
    rename: safe
  - name: branding
    label: Website branding images
    input: assets
    output: /assets
    categories: [image]
    rename: safe

content:
  - name: website
    label: AlyHackbart.com content
    type: file
    path: content/site-content.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: site
        label: Website and search
        type: object
        fields:
          - { name: url, label: Website URL, type: string, readonly: true }
          - { name: name, label: Website name, type: string, required: true }
          - { name: title, label: Search result title, type: string, required: true }
          - { name: description, label: Search description, type: text, required: true }
          - name: socialImage
            label: Social sharing image
            type: image
            required: true
            options:
              media: branding
              extensions: [jpg, jpeg, png, webp]
          - { name: updated, label: Last major update, type: date, required: true }
          - { name: googleSiteVerification, label: Google verification token, type: string }
          - { name: googleAnalyticsId, label: Google Analytics ID, type: string }

      - name: identity
        label: Aly's information
        type: object
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Professional title, type: string, required: true }
          - { name: location, label: Location, type: string, required: true }
          - { name: email, label: Form delivery email, type: string, required: true, readonly: true }
          - { name: publicEmail, label: Public email override, type: string }
          - { name: availability, label: Availability, type: text, required: true }

      - name: hero
        label: Homepage hero
        type: object
        fields:
          - { name: eyebrow, label: Small heading, type: string, required: true }
          - { name: name, label: Large name, type: string, required: true }
          - { name: role, label: Role, type: string, required: true }
          - { name: statement, label: Main statement, type: string, required: true }
          - { name: introduction, label: Introduction, type: text, required: true }
          - { name: primaryAction, label: Primary button, type: string, required: true }
          - { name: secondaryAction, label: Secondary button, type: string, required: true }
          - name: video
            label: Background video
            type: file
            required: true
            options:
              media: portfolio
              categories: [video]
              extensions: [mp4, webm, mov]
          - name: poster
            label: Background poster
            type: image
            required: true
            options:
              media: portfolio
              extensions: [jpg, jpeg, png, webp]
          - { name: mediaNote, label: Media note, type: text, required: true }
          - { name: ticker, label: Scrolling skills, type: string, list: true, required: true }

      - name: manifesto
        label: Editing approach
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: paragraphs, label: Paragraphs, type: text, list: true, required: true }
          - { name: pullQuote, label: Pull quote, type: text, required: true }

      - name: work
        label: Featured work
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: introduction, label: Introduction, type: text, required: true }
          - name: featured
            label: Featured professional credit
            type: object
            fields:
              - { name: category, label: Category, type: string, required: true }
              - { name: title, label: Project title, type: string, required: true }
              - { name: production, label: Production, type: string, required: true }
              - { name: role, label: Aly's role, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: videoId, label: YouTube video ID, type: string, required: true }
              - { name: videoUrl, label: Full YouTube URL, type: string, required: true }
              - { name: button, label: Video button, type: string, required: true }
          - name: reel
            label: Editing reel status
            type: object
            fields:
              - { name: label, label: Small label, type: string, required: true }
              - { name: headline, label: Headline, type: text, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: status, label: Status, type: string, required: true }
              - { name: button, label: Button, type: string, required: true }

      - name: experience
        label: Experience
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: introduction, label: Introduction, type: text, required: true }
          - name: items
            label: Experience entries
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{company}"
            fields:
              - { name: company, label: Company, type: string, required: true }
              - { name: dates, label: Dates, type: string, required: true }
              - { name: role, label: Role, type: string, required: true }
              - { name: summary, label: Summary, type: text, required: true }
              - { name: details, label: Details, type: string, list: true, required: true }

      - name: capabilities
        label: Capabilities
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: introduction, label: Introduction, type: text, required: true }
          - name: items
            label: Capabilities
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }

      - name: toolkit
        label: Toolkit
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: introduction, label: Introduction, type: text, required: true }
          - { name: software, label: Software, type: string, list: true, required: true }
          - { name: workflow, label: Workflow skills, type: string, list: true, required: true }

      - name: about
        label: About Aly
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - name: portrait
            label: Portrait
            type: image
            required: true
            options:
              media: portfolio
              extensions: [jpg, jpeg, png, webp]
          - { name: portraitAlt, label: Portrait description, type: string, required: true }
          - { name: paragraphs, label: Paragraphs, type: text, list: true, required: true }
          - { name: closing, label: Closing note, type: text, required: true }

      - name: qualities
        label: What Aly brings
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - name: items
            label: Qualities
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }

      - name: opportunities
        label: Job opportunities
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: targets, label: Target teams, type: string, list: true, required: true }
          - { name: primaryAction, label: Resume button, type: string, required: true }
          - { name: secondaryAction, label: Email button, type: string, required: true }

      - name: freelance
        label: Freelance
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: services, label: Services, type: string, list: true, required: true }
          - { name: action, label: Button, type: string, required: true }

      - name: contact
        label: Contact form
        type: object
        fields:
          - { name: label, label: Section label, type: string, required: true }
          - { name: headline, label: Headline, type: text, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: formEndpoint, label: Form endpoint, type: string, required: true, readonly: true }
          - { name: formSubject, label: Email subject, type: string, required: true }
          - { name: thankYouUrl, label: Thank-you URL, type: string, required: true, readonly: true }
          - { name: formSourceUrl, label: Source URL, type: string, required: true, readonly: true }
          - { name: autoresponse, label: Automatic reply, type: text, required: true }
          - { name: inquiryTypes, label: Inquiry choices, type: string, list: true, required: true }
          - { name: budgetRanges, label: Budget choices, type: string, list: true, required: true }

      - name: resume
        label: Resume page
        type: object
        fields:
          - { name: headline, label: Headline, type: text, required: true }
          - { name: role, label: Professional title, type: string, required: true }
          - { name: summary, label: Summary, type: text, required: true }
          - name: experience
            label: Resume experience
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{company}"
            fields:
              - { name: role, label: Role, type: string, required: true }
              - { name: company, label: Company, type: string, required: true }
              - { name: dates, label: Dates, type: string, required: true }
              - { name: bullets, label: Details, type: string, list: true, required: true }
          - { name: skills, label: Skills, type: string, list: true, required: true }

      - name: privacy
        label: Privacy notice
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: effectiveDate, label: Effective date, type: string, required: true }
