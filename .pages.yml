media:
  - name: portfolio
    label: Portfolio images and video
    input: assets/media
    output: /assets/media
    categories: [image, video]
    rename: safe
  - name: branding
    label: Website branding images
    input: assets
    output: /assets
    categories: [image]
    rename: safe

content:
  - name: website
    label: AlyHackbart.com content
    type: file
    path: content/site-content.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: site
        label: Website and search settings
        type: object
        fields:
          - name: url
            label: Website URL
            type: string
            readonly: true
          - name: name
            label: Website name
            type: string
            required: true
          - name: domainName
            label: Display domain name
            type: string
            required: true
          - name: title
            label: Search result title
            type: string
            required: true
            options:
              maxlength: 70
          - name: description
            label: Search result description
            type: text
            required: true
            options:
              maxlength: 170
          - name: socialImage
            label: Social sharing image
            type: image
            required: true
            description: Recommended size is 1200 by 630 pixels.
            options:
              media: branding
              extensions: [jpg, jpeg, png, webp]
          - name: updated
            label: Last major update
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: googleSiteVerification
            label: Google Search Console verification token
            type: string
            description: Leave blank until Google gives you the exact token.
          - name: googleAnalyticsId
            label: Google Analytics measurement ID
            type: string
            description: Optional. Use an ID beginning with G- only after reviewing privacy requirements.
            pattern:
              regex: "^$|^G-[A-Z0-9]+$"
              message: Leave blank or enter a valid Google Analytics ID beginning with G-.

      - name: business
        label: Business information
        type: object
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: location
            label: Location
            type: string
            required: true
          - name: email
            label: Form delivery email
            type: string
            required: true
            readonly: true
            description: The active form currently delivers to this verified address.
          - name: publicEmail
            label: Public business email
            type: string
            description: Leave blank to show the verified Gmail address.
          - name: serviceArea
            label: Service area description
            type: text
            required: true
          - name: areaServed
            label: Areas served
            type: string
            list: true

      - name: hero
        label: Homepage hero
        type: object
        fields:
          - name: eyebrow
            label: Small heading
            type: string
            required: true
          - name: headline
            label: Main headline
            type: text
            required: true
          - name: introduction
            label: Introduction
            type: text
            required: true
          - name: primaryAction
            label: Primary button text
            type: string
            required: true
          - name: secondaryAction
            label: Secondary button text
            type: string
            required: true
          - name: video
            label: Hero reel
            type: file
            required: true
            options:
              media: portfolio
              categories: [video]
              extensions: [mp4, webm, mov]
          - name: poster
            label: Hero poster image
            type: image
            required: true
            options:
              media: portfolio
              extensions: [jpg, jpeg, png, webp]
          - name: fallbackVideo
            type: string
            hidden: true
            readonly: true
          - name: fallbackPoster
            type: string
            hidden: true
            readonly: true
          - name: videoLabel
            label: Reel label
            type: string
          - name: videoNote
            label: Reel note
            type: string
          - name: disclosure
            label: Sample media disclosure
            type: text
            required: true
          - name: proof
            label: Quick facts
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Fact heading
                type: string
                required: true
              - name: detail
                label: Fact detail
                type: string
                required: true

      - name: work
        label: Portfolio and work
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
            required: true
          - name: headline
            label: Section headline
            type: text
            required: true
          - name: introduction
            label: Section introduction
            type: text
            required: true
          - name: featuredCredit
            label: Featured professional credit
            type: object
            fields:
              - name: eyebrow
                label: Small heading
                type: string
              - name: title
                label: Project title
                type: string
              - name: description
                label: Project description
                type: text
              - name: videoId
                label: YouTube video ID
                type: string
                description: The short ID from the YouTube URL, such as eSkU9LMWX38.
              - name: videoUrl
                label: Full YouTube URL
                type: string
              - name: channel
                label: Channel or production name
                type: string
          - name: projects
            label: Portfolio projects
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Project title
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: services
                label: Role and deliverables
                type: string
                required: true
              - name: image
                label: Project image
                type: image
                required: true
                options:
                  media: portfolio
                  extensions: [jpg, jpeg, png, webp]
              - name: fallbackImage
                type: string
                hidden: true
                readonly: true
              - name: fallbackKey
                type: string
                hidden: true
                readonly: true
              - name: alt
                label: Image description for accessibility
                type: text
                required: true
              - name: layout
                label: Image shape
                type: select
                required: true
                options:
                  values:
                    - name: wide
                      label: Wide
                    - name: portrait
                      label: Portrait
                    - name: landscape
                      label: Landscape
              - name: sample
                label: Show Concept sample label
                type: boolean
                default: true
                description: Turn this off only when the image and project are real, approved work.
          - name: invitation
            label: Restaurant collaboration callout
            type: object
            fields:
              - name: eyebrow
                label: Small heading
                type: string
              - name: headline
                label: Headline
                type: text
              - name: description
                label: Description
                type: text
              - name: action
                label: Button text
                type: string

      - name: services
        label: Services
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: note
            label: Pricing note
            type: text
          - name: items
            label: Service list
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title} - {price}"
            fields:
              - name: title
                label: Service name
                type: string
                required: true
              - name: description
                label: Service description
                type: text
                required: true
              - name: price
                label: Display price
                type: string
                required: true

      - name: packages
        label: Packages and add-ons
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: items
            label: Package list
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name} - {price}"
            fields:
              - name: name
                label: Package name
                type: string
                required: true
              - name: price
                label: Starting price
                type: string
                required: true
              - name: description
                label: Package description
                type: text
                required: true
              - name: featured
                label: Highlight this package
                type: boolean
              - name: formValue
                label: Inquiry form value
                type: string
                required: true
                description: Keep this aligned with a project type in the contact form.
              - name: features
                label: Included features
                type: string
                list: true
          - name: custom
            label: Custom quote callout
            type: object
            fields:
              - name: eyebrow
                label: Small heading
                type: string
              - name: headline
                label: Headline
                type: string
              - name: description
                label: Description
                type: text
              - name: action
                label: Button text
                type: string
          - name: addOns
            label: Optional add-ons
            type: string
            list: true
          - name: note
            label: Add-on note
            type: text

      - name: process
        label: How it works
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: steps
            label: Process steps
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Step title
                type: string
                required: true
              - name: description
                label: Step description
                type: text
                required: true

      - name: faq
        label: Frequently asked questions
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: items
            label: Questions and answers
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{question}"
            fields:
              - name: question
                label: Question
                type: string
                required: true
              - name: answer
                label: Answer
                type: text
                required: true

      - name: policies
        label: Project policies
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: items
            label: Policy list
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Policy heading
                type: string
                required: true
              - name: description
                label: Policy description
                type: text
                required: true
          - name: note
            label: Policy disclaimer
            type: text

      - name: about
        label: About Aly
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: body
            label: Biography
            type: text
          - name: note
            label: Availability note
            type: text
          - name: monogram
            label: Placeholder initials
            type: string
          - name: portrait
            label: Professional portrait
            type: image
            options:
              media: portfolio
              extensions: [jpg, jpeg, png, webp]
          - name: portraitAlt
            label: Portrait description
            type: string
          - name: behindScenes
            label: Behind-the-scenes image
            type: image
            options:
              media: portfolio
              extensions: [jpg, jpeg, png, webp]
          - name: behindScenesAlt
            label: Behind-the-scenes image description
            type: string
          - name: placeholder
            label: Placeholder text
            type: string

      - name: contact
        label: Contact form
        type: object
        fields:
          - name: eyebrow
            label: Section label
            type: string
          - name: headline
            label: Section headline
            type: text
          - name: introduction
            label: Section introduction
            type: text
          - name: formEndpoint
            type: string
            hidden: true
            readonly: true
          - name: formSubject
            label: Inquiry email subject
            type: string
          - name: thankYouUrl
            type: string
            hidden: true
            readonly: true
          - name: formSourceUrl
            type: string
            hidden: true
            readonly: true
          - name: autoresponse
            label: Automatic reply message
            type: text
          - name: projectTypes
            label: Project type choices
            type: string
            list: true
          - name: budgets
            label: Budget choices
            type: string
            list: true

      - name: privacy
        label: Privacy notice
        type: object
        fields:
          - name: title
            label: Page title
            type: string
          - name: description
            label: Page description
            type: text
          - name: effectiveDate
            label: Effective date shown on page
            type: string

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Create {path} via Pages CMS"
      update: "Update {path} via Pages CMS"
      delete: "Delete {path} via Pages CMS"
      rename: "Rename {oldPath} to {newPath} via Pages CMS"

actions:
  - name: rebuild-site
    label: Rebuild website
    workflow: prerender.yml
    ref: current
    cancelable: false
    confirm:
      title: Rebuild AlyHackbart.com?
      message: This regenerates the static website from the saved content.
      button: Rebuild website
