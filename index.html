<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4e7eb">
  <meta name="description" content="San Diego video editing, social content, event coverage, restaurant content, and wedding films by Aly Hackbart.">
  <meta property="og:title" content="Aly Hackbart | San Diego Video Editing and Content">
  <meta property="og:description" content="Browse video editing, social content, event coverage, restaurant content, and wedding packages from Aly Hackbart in San Diego.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alyhackbart.com/">
  <meta name="twitter:card" content="summary_large_image">
  <title>Aly Hackbart | San Diego Video Editing and Content</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <a class="brand" href="#top" aria-label="Aly Hackbart home" data-business-name>Aly Hackbart</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Primary navigation">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#packages">Packages</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="header-cta" href="#contact">Start a project</a>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow" data-bind="hero.eyebrow"></p>
        <h1 id="hero-title" data-bind="hero.headline"></h1>
        <p class="hero-intro" data-bind="hero.introduction"></p>
        <div class="hero-actions">
          <a class="button button-primary" href="#packages" data-bind="hero.primaryAction"></a>
          <a class="button button-secondary" href="#work" data-bind="hero.secondaryAction"></a>
        </div>
      </div>

      <div class="hero-visual">
        <div class="reel-frame">
          <video id="sample-reel" class="sample-reel" data-reel autoplay muted loop playsinline preload="metadata" aria-label="Concept reel showing sample visual directions for Aly's services"></video>
          <div class="media-overlay"><span data-bind="hero.videoLabel"></span><span data-bind="hero.videoNote"></span></div>
          <button class="video-toggle" type="button" aria-controls="sample-reel" aria-pressed="false">Pause reel</button>
        </div>
        <p class="concept-note" data-bind="hero.disclosure"></p>
      </div>

      <div class="hero-proof" id="hero-proof" aria-label="Service summary"></div>
    </section>

    <section class="work-section" id="work" aria-labelledby="work-title">
      <div class="section-heading">
        <p class="eyebrow" data-bind="work.eyebrow"></p>
        <h2 id="work-title" data-bind="work.headline"></h2>
        <p data-bind="work.introduction"></p>
      </div>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section class="services-section" id="services" aria-labelledby="services-title">
      <div class="section-heading section-heading-dark">
        <p class="eyebrow" data-bind="services.eyebrow"></p>
        <h2 id="services-title" data-bind="services.headline"></h2>
        <p data-bind="services.introduction"></p>
      </div>
      <div class="service-list" id="service-list"></div>
      <p class="pricing-note" data-bind="services.note"></p>
    </section>

    <section class="packages-section" id="packages" aria-labelledby="packages-title">
      <div class="section-heading">
        <p class="eyebrow" data-bind="packages.eyebrow"></p>
        <h2 id="packages-title" data-bind="packages.headline"></h2>
        <p data-bind="packages.introduction"></p>
      </div>
      <div class="package-grid" id="package-grid"></div>
      <div class="custom-quote">
        <div><p class="eyebrow" data-bind="packages.custom.eyebrow"></p><h3 data-bind="packages.custom.headline"></h3></div>
        <p data-bind="packages.custom.description"></p>
        <a class="button button-dark" href="#contact" data-bind="packages.custom.action"></a>
      </div>
    </section>

    <section class="process-section" aria-labelledby="process-title">
      <div class="section-heading">
        <p class="eyebrow" data-bind="process.eyebrow"></p>
        <h2 id="process-title" data-bind="process.headline"></h2>
        <p data-bind="process.introduction"></p>
      </div>
      <div class="process-list" id="process-list"></div>
    </section>

    <section class="about-section" id="about" aria-labelledby="about-title">
      <div class="about-mark" id="about-media" aria-label="Aly Hackbart portrait area">
        <span data-bind="about.monogram"></span>
        <small data-bind="about.placeholder"></small>
      </div>
      <div class="about-copy">
        <p class="eyebrow" data-bind="about.eyebrow"></p>
        <h2 id="about-title" data-bind="about.headline"></h2>
        <p data-bind="about.body"></p>
        <p class="about-note" data-bind="about.note"></p>
      </div>
    </section>

    <section class="contact-section" id="contact" aria-labelledby="contact-title">
      <div class="contact-copy">
        <p class="eyebrow" data-bind="contact.eyebrow"></p>
        <h2 id="contact-title" data-bind="contact.headline"></h2>
        <p data-bind="contact.introduction"></p>
        <dl class="contact-details">
          <div><dt>Email</dt><dd><a data-contact-email href="mailto:alysonhackbart@gmail.com">alysonhackbart@gmail.com</a></dd></div>
          <div><dt>Based in</dt><dd data-business-location>San Diego, California</dd></div>
        </dl>
      </div>

      <form class="inquiry-form" action="https://formsubmit.co/251d51551e089c4c1000323b75ae9878" method="POST">
        <input type="hidden" name="_subject" value="New AlyHackbart.com project inquiry" data-form-subject>
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://alyhackbart.com/thanks.html" data-form-next>
        <input type="hidden" name="_url" value="https://alyhackbart.com/#contact" data-form-source>
        <input type="hidden" name="_autoresponse" value="Thanks for reaching out to Aly Hackbart. Your project inquiry was received, and Aly will reply as soon as possible." data-form-autoresponse>
        <label class="honeypot" aria-hidden="true">Leave this field empty<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label>

        <div class="form-grid">
          <label>Full name <span aria-hidden="true">*</span><input type="text" name="Full name" autocomplete="name" required></label>
          <label>Email <span aria-hidden="true">*</span><input type="email" name="email" autocomplete="email" required></label>
          <label>Phone<input type="tel" name="Phone" autocomplete="tel"></label>
          <label>Business or organization<input type="text" name="Business or organization" autocomplete="organization"></label>
          <label>Project type <span aria-hidden="true">*</span><select name="Project type" id="project-type" required><option value="" selected disabled>Select a project type</option></select></label>
          <label>Approximate budget<select name="Approximate budget" id="budget-range"><option value="" selected>Select a range</option></select></label>
          <label>Preferred date<input type="date" name="Preferred date"></label>
          <label>Project location<input type="text" name="Project location" placeholder="San Diego, venue, or remote" autocomplete="street-address"></label>
          <label class="form-full">Project details <span aria-hidden="true">*</span><textarea name="Project details" rows="7" placeholder="Tell Aly about the project, deliverables, platforms, timing, and anything else that would help." required></textarea></label>
          <label class="consent"><input type="checkbox" name="Consent" value="Agreed" required><span>I agree that Aly may use the information I provide to respond to this project inquiry.</span></label>
        </div>

        <div class="form-footer">
          <p><span aria-hidden="true">*</span> Required fields. Submissions are used only to respond to your inquiry.</p>
          <button class="submit-button" type="submit">Send project inquiry</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> <span data-business-name>Aly Hackbart</span></span>
    <div><a href="#work">Work</a><a href="#services">Services</a><a href="#packages">Packages</a><a href="#top">Back to top</a></div>
  </footer>

  <noscript><p class="noscript-message">This site needs JavaScript enabled to display its editable content.</p></noscript>
  <script src="media/hero.js"></script>
  <script src="media/restaurant.js"></script>
  <script src="media/creator.js"></script>
  <script src="media/event.js"></script>
  <script src="media/wedding.js"></script>
  <script src="media/reel.js"></script>
  <script src="content/site-content.js"></script>
  <script src="script.js"></script>
</body>
</html>
